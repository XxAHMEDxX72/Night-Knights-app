<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد موقع الراكب</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #111827; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; background: #374151; border: 1px solid #4b5563; border-radius: 8px; color: white; margin: 8px 0 15px; }
        #map { height: 220px; border-radius: 10px; margin-bottom: 15px; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align: center; color: #60a5fa;">إرسال موقع الراكب 🚖</h2>
    <label>اسمك:</label>
    <input type="text" id="passengerName" placeholder="اكتب اسمك هنا...">

    <label>حدد مكانك على الخريطة:</label>
    <div id="map"></div>

    <button onclick="sendLocation()">تأكيد وإرسال للسائق</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://night-knights-app-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let lat = 30.0444, lng = 31.2357;
    const map = L.map('map').setView([lat, lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const marker = L.marker([lat, lng], { draggable: true }).addTo(map);

    marker.on('dragend', () => {
        const pos = marker.getLatLng();
        lat = pos.lat; lng = pos.lng;
    });

    function sendLocation() {
        const name = document.getElementById('passengerName').value.trim();
        if(!name) { alert('اكتب اسمك الأول!'); return; }

        db.ref('rides').push({
            name: name,
            lat: lat,
            lng: lng,
            timestamp: Date.now()
        }, (error) => {
            if(!error) {
                alert('تم إرسال موقعك للسائق بنجاح!');
            }
        });
    }
</script>

</body>
</html>

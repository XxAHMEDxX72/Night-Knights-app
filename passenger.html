<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بيانات الراكب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #1e293b; }
        .form-group { text-align: right; margin-bottom: 15px; }
        label { font-size: 14px; font-weight: bold; color: #334155; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .status-msg { margin-top: 10px; font-size: 13px; color: #0284c7; }
    </style>
</head>
<body>

<div class="card">
    <h2>تسجيل بيانات الراكب</h2>
    <form id="passengerForm">
        <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="pName" placeholder="أدخل اسمك" required>
        </div>
        <div class="form-group">
            <label>رابط الموقع (خرائط جوجل):</label>
            <input type="url" id="pAddress" placeholder="إلصق رابط Google Maps هنا" required>
        </div>

        <p id="statusMsg" class="status-msg"></p>
        <button type="submit" id="submitBtn" class="btn">إرسال البيانات للسائق</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
        authDomain: "black-knights-5c5a8.firebaseapp.com",
        databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
        projectId: "black-knights-5c5a8",
        storageBucket: "black-knights-5c5a8.firebasestorage.app",
        messagingSenderId: "699141823797",
        appId: "1:699141823797:web:11768011079d9701f0807c",
        measurementId: "G-JX743D3NH8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    // دالة استخراج الإحداثيات من النصوص أو الرابط
    function parseCoords(text) {
        const reg1 = /@(-?\d+\.\d+),(-?\d+\.\d+)/;
        const reg2 = /q=(-?\d+\.\d+),(-?\d+\.\d+)/;
        const reg3 = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;

        const m1 = text.match(reg1);
        if (m1) return { lat: parseFloat(m1[1]), lng: parseFloat(m1[2]) };

        const m2 = text.match(reg2);
        if (m2) return { lat: parseFloat(m2[1]), lng: parseFloat(m2[2]) };

        const m3 = text.match(reg3);
        if (m3) return { lat: parseFloat(m3[1]), lng: parseFloat(m3[2]) };

        return null;
    }

    // دالة فك الرابط المختصر للوصول للرابط الأصلي الحاوي للإحداثيات
    async function resolveShortUrl(shortUrl) {
        let coords = parseCoords(shortUrl);
        if (coords) return coords;

        try {
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(shortUrl)}`;
            const response = await fetch(proxyUrl);
            const finalUrl = response.url;
            return parseCoords(finalUrl);
        } catch (e) {
            console.error("فشل فك الرابط:", e);
            return null;
        }
    }

    document.getElementById("passengerForm").onsubmit = async (e) => {
        e.preventDefault();
        
        if (!roomId) {
            alert("خطأ: رابط الرحلة غير صحيح أو غير موجود!");
            return;
        }

        const name = document.getElementById("pName").value.trim();
        const addressUrl = document.getElementById("pAddress").value.trim();
        const statusMsg = document.getElementById("statusMsg");
        const submitBtn = document.getElementById("submitBtn");

        submitBtn.disabled = true;
        statusMsg.innerText = "جاري قراءة الرابط واستخراج الموقع...";

        const coords = await resolveShortUrl(addressUrl);

        push(ref(db, `rooms/${roomId}/passengers`), {
            name: name,
            address: addressUrl,
            lat: coords ? coords.lat : null,
            lng: coords ? coords.lng : null,
            timestamp: Date.now()
        }).then(() => {
            alert("تم إرسال بياناتك بنجاح للسائق!");
            document.getElementById("passengerForm").reset();
            statusMsg.innerText = "";
            submitBtn.disabled = false;
        }).catch((err) => {
            alert("حدث خطأ أثناء الإرسال: " + err.message);
            statusMsg.innerText = "";
            submitBtn.disabled = false;
        });
    };
</script>
</body>
</html>

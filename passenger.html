<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بيانات الراكب</title>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #1e293b; }
        .form-group { text-align: right; margin-bottom: 15px; }
        label { font-size: 14px; font-weight: bold; color: #334155; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn-location { background: #10b981; margin-bottom: 10px; }
        .status-msg { margin-top: 8px; font-size: 13px; color: #059669; }
    </style>
</head>
<body>

<div class="card">
    <h2>تسجيل بيانات الراكب</h2>
    <form id="passengerForm">
        <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="pName" placeholder="أدخل اسمك" required>
        </div>
        <div class="form-group">
            <label>رابط موقع المنزل (خرائط جوجل):</label>
            <input type="text" id="pAddress" placeholder="أو أدخل الرابط يدويًا">
        </div>

        <button type="button" id="btnGetLocation" class="btn btn-location">📍 تحديد موقعي الحالي تلقائياً</button>
        <p id="locationStatus" class="status-msg"></p>

        <button type="submit" class="btn">إرسال البيانات للسائق</button>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
        authDomain: "black-knights-5c5a8.firebaseapp.com",
        databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
        projectId: "black-knights-5c5a8",
        storageBucket: "black-knights-5c5a8.firebasestorage.app",
        messagingSenderId: "699141823797",
        appId: "1:699141823797:web:11768011079d9701f0807c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentLat = null;
    let currentLng = null;

    document.getElementById("btnGetLocation").onclick = () => {
        const status = document.getElementById("locationStatus");
        if (navigator.geolocation) {
            status.innerText = "جاري تحديد موقعك...";
            navigator.geolocation.getCurrentPosition((pos) => {
                currentLat = pos.coords.latitude;
                currentLng = pos.coords.longitude;
                status.innerText = "✅ تم تحديد موقعك بنجاح!";
            }, (err) => {
                status.innerText = "❌ تعذر تحديد الموقع، يرجى تفعيل الـ GPS.";
            });
        } else {
            status.innerText = "❌ المتصفح لا يدعم التحديد التلقائي.";
        }
    };

    document.getElementById("passengerForm").onsubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById("pName").value;
        const address = document.getElementById("pAddress").value;

        db.ref('passengers').push({
            name: name,
            address: address,
            lat: currentLat,
            lng: currentLng,
            timestamp: Date.now()
        }).then(() => {
            alert("تم إرسال بياناتك بنجاح للسائق!");
            document.getElementById("passengerForm").reset();
            document.getElementById("locationStatus").innerText = "";
        }).catch((err) => {
            alert("حدث خطأ أثناء الإرسال: " + err.message);
        });
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد عنوان المنزل</title>
    <!-- Firebase JS SDK (v9+ compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #111827; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { text-align: center; margin-top: 0; font-size: 18px; color: #60a5fa; }
        label { display: block; margin: 10px 0 5px; font-size: 13px; color: #9ca3af; }
        input { width: 100%; padding: 11px; background: #374151; border: 1px solid #4b5563; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        .search-container { display: flex; gap: 6px; margin-bottom: 10px; }
        .search-container input { margin: 0; flex: 1; }
        .btn-search { background: #0284c7; color: white; border: none; padding: 0 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-gps { background: #10b981; color: white; border: none; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        #map { height: 210px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #4b5563; }
        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <h2>حدد عنوان بيتك للنزول 🏠</h2>

    <label>اسم الراكب:</label>
    <input type="text" id="passengerName" placeholder="اكتب اسمك..." required>

    <label>ابحث عن الشارع / المنطقة:</label>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="مثال: شارع الهرم، الجيزة">
        <button class="btn-search" onclick="searchAddress()">بحث</button>
    </div>

    <button class="btn-gps" onclick="getCurrentLocation()">📍 تحديث موقعي الحالي بالـ GPS</button>

    <div id="map"></div>

    <button class="btn-submit" onclick="sendHouseLocation()">تأكيد وإرسال للسائق 🚀</button>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // إعدادات مشروع Firebase الخاص بك
    const firebaseConfig = {
        apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
        authDomain: "black-knights-5c5a8.firebaseapp.com",
        databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
        projectId: "black-knights-5c5a8",
        storageBucket: "black-knights-5c5a8.firebasestorage.app",
        messagingSenderId: "699141823797",
        appId: "1:699141823797:web:11768011079d9701f0807c",
        measurementId: "G-JX743D3NH8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let lat = 30.0444;
    let lng = 31.2357;

    const map = L.map('map').setView([lat, lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const marker = L.marker([lat, lng], { draggable: true }).addTo(map);

    function updateMarker(newLat, newLng) {
        lat = newLat;
        lng = newLng;
        map.setView([lat, lng], 16);
        marker.setLatLng([lat, lng]);
    }

    marker.on('dragend', () => {
        const pos = marker.getLatLng();
        lat = pos.lat; lng = pos.lng;
    });

    map.on('click', (e) => {
        marker.setLatLng(e.latlng);
        lat = e.latlng.lat; lng = e.latlng.lng;
    });

    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                updateMarker(pos.coords.latitude, pos.coords.longitude);
            }, () => {
                alert('تعذر تحديد موقعك تلقائياً، يمكنك البحث في الخانة المخصصة.');
            });
        }
    }

    window.onload = getCurrentLocation;

    async function searchAddress() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data && data.length > 0) {
                updateMarker(parseFloat(data[0].lat), parseFloat(data[0].lon));
            } else {
                alert('لم يتم العثور على نتائج، حاول البحث باسم الشارع أو المنطقة.');
            }
        } catch (e) {
            alert('حدث خطأ أثناء البحث.');
        }
    }

    function sendHouseLocation() {
        const name = document.getElementById('passengerName').value.trim();
        if (!name) {
            alert('برجاء كتابة اسمك أولاً!');
            return;
        }

        // إرسال البيانات لقاعدة بيانات الفايربيس
        db.ref('rides').push({
            name: name,
            lat: lat,
            lng: lng,
            timestamp: Date.now()
        }, (err) => {
            if (!err) {
                alert('تم إرسال عنوان بيتك للسائق بنجاح!');
            } else {
                alert('حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.');
            }
        });
    }
</script>

</body>
</html>

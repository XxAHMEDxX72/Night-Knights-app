<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد عنوان المنزل</title>
    <!-- Firebase JS SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #111827; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { text-align: center; margin-top: 0; font-size: 18px; color: #60a5fa; }
        .room-badge { text-align: center; background: #374151; padding: 4px 10px; border-radius: 8px; font-size: 12px; color: #10b981; margin-bottom: 12px; font-weight: bold; }
        label { display: block; margin: 10px 0 5px; font-size: 13px; color: #9ca3af; }
        input { width: 100%; padding: 11px; background: #374151; border: 1px solid #4b5563; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        
        .search-wrapper { position: relative; margin-bottom: 10px; }
        .suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: #1f2937; border: 1px solid #4b5563; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #374151; font-size: 12px; cursor: pointer; color: #e5e7eb; }
        .suggestion-item:hover { background: #374151; color: #60a5fa; }
        .btn-gps { background: #10b981; color: white; border: none; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        #map { height: 220px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #4b5563; }
        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h2>حدد عنوان بيتك للنزول 🏠</h2>
    <div class="room-badge" id="roomBadge">رمز الرحلة: جاري التحميل...</div>
    
    <label>اسم الراكب:</label>
    <input type="text" id="passengerName" placeholder="اكتب اسمك..." required>
    
    <label>ابحث عن الشارع / منطقة / محطة (في مصر):</label>
    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="مثال: محطة مترو فيصل..." oninput="handleSearchInput()">
        <div class="suggestions-list" id="suggestionsList"></div>
    </div>
    
    <button class="btn-gps" onclick="getCurrentLocation()">📍 تحديث موقعي الحالي بالـ GPS</button>
    <div id="map"></div>
    <button class="btn-submit" onclick="sendHouseLocation()">تأكيد وإرسال للسائق 🚀</button>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
        authDomain: "black-knights-5c5a8.firebaseapp.com",
        databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
        projectId: "black-knights-5c5a8",
        storageBucket: "black-knights-5c5a8.firebasestorage.app",
        messagingSenderId: "699141823797",
        appId: "1:699141823797:web:11768011079d9701f0807c",
        measurementId: "G-JX743D3NH8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // قراءة roomId من رابط الصفحة (URL Query Param)
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    if (!roomId) {
        alert("خطأ: رابط الصفحة غير مكتمل أو لا يحتوي على رمز الرحلة!");
        document.getElementById('roomBadge').innerText = "خطأ: رحلة غير معروفة";
        document.getElementById('roomBadge').style.color = "#ef4444";
    } else {
        document.getElementById('roomBadge').innerText = `انضمام للرحلة رقم: ${roomId}`;
    }

    let lat = 30.0444;
    let lng = 31.2357;
    let searchTimeout = null;
    let driverLiveMarker = null;

    const map = L.map('map').setView([lat, lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const marker = L.marker([lat, lng], { draggable: true }).addTo(map);

    function updateMarker(newLat, newLng) {
        lat = newLat;
        lng = newLng;
        map.setView([lat, lng], 16);
        marker.setLatLng([lat, lng]);
    }

    marker.on('dragend', () => {
        const pos = marker.getLatLng();
        lat = pos.lat; lng = pos.lng;
    });

    map.on('click', (e) => {
        marker.setLatLng(e.latlng);
        lat = e.latlng.lat; lng = e.latlng.lng;
    });

    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                updateMarker(pos.coords.latitude, pos.coords.longitude);
            });
        }
    }

    // متابعة موقع السائق الخاص بهذه الغرفة فقط
    if (roomId) {
        db.ref(`rooms/${roomId}/driver_location`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lng) {
                const driverPos = [data.lat, data.lng];
                if (driverLiveMarker) {
                    driverLiveMarker.setLatLng(driverPos);
                } else {
                    driverLiveMarker = L.marker(driverPos, {
                        icon: L.icon({
                            iconUrl: 'https://cdn-icons-png.flaticon.com/512/854/854878.png',
                            iconSize: [32, 32]
                        })
                    }).addTo(map).bindPopup("موقع السيارة الحالي 🚖");
                }
            }
        });
    }

    function handleSearchInput() {
        clearTimeout(searchTimeout);
        const query = document.getElementById('searchInput').value.trim();
        const list = document.getElementById('suggestionsList');
        if (query.length < 3) {
            list.style.display = 'none';
            return;
        }
        searchTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=eg&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                list.innerHTML = '';
                if (data && data.length > 0) {
                    list.style.display = 'block';
                    data.slice(0, 5).forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerText = item.display_name;
                        div.onclick = () => {
                            updateMarker(parseFloat(item.lat), parseFloat(item.lon));
                            document.getElementById('searchInput').value = item.display_name.split(',')[0];
                            list.style.display = 'none';
                        };
                        list.appendChild(div);
                    });
                } else {
                    list.style.display = 'none';
                }
            } catch (e) {
                list.style.display = 'none';
            }
        }, 300);
    }

    function sendHouseLocation() {
        if (!roomId) {
            alert('لا يمكن إرسال الموقع بدون رمز رحلة صحيح!');
            return;
        }
        const name = document.getElementById('passengerName').value.trim();
        if (!name) {
            alert('برجاء كتابة اسمك أولاً!');
            return;
        }

        // الحفظ داخل مسار الغرفة المحددة
        db.ref(`rooms/${roomId}/rides`).push({
            name: name,
            lat: lat,
            lng: lng,
            timestamp: Date.now()
        }, (err) => {
            if (!err) {
                alert('تم إرسال عنوان بيتك للسائق بنجاح!');
            } else {
                alert('حدث خطأ في الاتصال.');
            }
        });
    }

    window.onload = getCurrentLocation;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد عنوان المنزل والتتبع</title>
    <!-- Firebase JS SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: #111827; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        body.light-mode { background: #f3f4f6; color: #111827; }

        .card { background: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        body.light-mode .card { background: #ffffff; border-color: #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        h2 { text-align: center; margin-top: 0; font-size: 18px; color: #60a5fa; }
        .room-badge { text-align: center; background: #374151; padding: 4px 10px; border-radius: 8px; font-size: 12px; color: #10b981; margin-bottom: 12px; font-weight: bold; }
        body.light-mode .room-badge { background: #e2e8f0; color: #059669; }

        label { display: block; margin: 10px 0 5px; font-size: 13px; color: #9ca3af; }
        body.light-mode label { color: #4b5563; }

        input { width: 100%; padding: 11px; background: #374151; border: 1px solid #4b5563; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        body.light-mode input { background: #f8fafc; border-color: #cbd5e1; color: #111827; }
        
        .search-wrapper { position: relative; margin-bottom: 10px; }
        .suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: #1f2937; border: 1px solid #4b5563; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #374151; font-size: 12px; cursor: pointer; color: #e5e7eb; }
        .suggestion-item:hover { background: #374151; color: #60a5fa; }
        .btn-gps { background: #10b981; color: white; border: none; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        #map { height: 220px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #4b5563; }
        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }

        .tracking-panel { display: none; margin-top: 15px; background: #111827; padding: 12px; border-radius: 12px; border: 1px solid #374151; text-align: center; }
        body.light-mode .tracking-panel { background: #f8fafc; border-color: #cbd5e1; }
        .tracking-status { font-weight: bold; font-size: 14px; color: #3b82f6; margin-bottom: 5px; }
        .eta-badge { font-size: 13px; color: #10b981; font-weight: bold; }

        .car-passenger-icon { transition: left 0.8s linear, top 0.8s linear; }
    </style>
</head>
<body>
<div class="card">
    <h2>حدد عنوان بيتك للنزول 🏠</h2>
    <div class="room-badge" id="roomBadge">رمز الرحلة: جاري التحميل...</div>
    
    <label>اسم الراكب:</label>
    <input type="text" id="passengerName" placeholder="اكتب اسمك..." required>
    
    <label>ابحث عن الشارع / منطقة / محطة (في مصر):</label>
    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="مثال: محطة مترو فيصل..." oninput="handleSearchInput()">
        <div class="suggestions-list" id="suggestionsList"></div>
    </div>
    
    <button class="btn-gps" onclick="getCurrentLocation()">📍 تحديث موقعي الحالي بالـ GPS</button>
    <div id="map"></div>
    <button class="btn-submit" id="submitBtn" onclick="sendHouseLocation()">تأكيد وإرسال للسائق 🚀</button>

    <div class="tracking-panel" id="trackingPanel">
        <div class="tracking-status" id="trackingStatus">🚘 جاري تتبع موقع السائق...</div>
        <div class="eta-badge" id="etaBadge">المسافة: -- كم | الوقت التقديري: -- دقيقة</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
        authDomain: "black-knights-5c5a8.firebaseapp.com",
        databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
        projectId: "black-knights-5c5a8",
        storageBucket: "black-knights-5c5a8.firebasestorage.app",
        messagingSenderId: "699141823797",
        appId: "1:699141823797:web:11768011079d9701f0807c",
        measurementId: "G-JX743D3NH8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    if (!roomId) {
        alert("خطأ: رابط الصفحة غير مكتمل أو لا يحتوي على رمز الرحلة!");
        document.getElementById('roomBadge').innerText = "خطأ: رحلة غير معروفة";
        document.getElementById('roomBadge').style.color = "#ef4444";
    } else {
        document.getElementById('roomBadge').innerText = `انضمام للرحلة رقم: ${roomId}`;
    }

    let lat = 30.0444;
    let lng = 31.2357;
    let searchTimeout = null;
    let driverLiveMarker = null;

    const map = L.map('map').setView([lat, lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const marker = L.marker([lat, lng], { draggable: true }).addTo(map);

    function updateMarker(newLat, newLng) {
        lat = newLat;
        lng = newLng;
        map.setView([lat, lng], 16);
        marker.setLatLng([lat, lng]);
        calculateAndShowETA();
    }

    marker.on('dragend', () => {
        const pos = marker.getLatLng();
        lat = pos.lat; lng = pos.lng;
        calculateAndShowETA();
    });

    map.on('click', (e) => {
        marker.setLatLng(e.latlng);
        lat = e.latlng.lat; lng = e.latlng.lng;
        calculateAndShowETA();
    });

    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                updateMarker(pos.coords.latitude, pos.coords.longitude);
            });
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    let currentDriverLat = null;
    let currentDriverLng = null;

    function moveDriverMarkerSmoothly(targetLat, targetLng) {
        if (!driverLiveMarker) return;
        const startLatLng = driverLiveMarker.getLatLng();
        const startLat = startLatLng.lat;
        const startLng = startLatLng.lng;
        
        let startTime = null;
        const duration = 800;

        function animate(time) {
            if (!startTime) startTime = time;
            const progress = Math.min((time - startTime) / duration, 1);
            const cLat = startLat + (targetLat - startLat) * progress;
            const cLng = startLng + (targetLng - startLng) * progress;
            
            driverLiveMarker.setLatLng([cLat, cLng]);

            if (progress < 1) {
                requestAnimationFrame(animate);
            }
        }
        requestAnimationFrame(animate);
    }

    function calculateAndShowETA() {
        if (!currentDriverLat || !currentDriverLng) return;
        const dist = calculateDistance(lat, lng, currentDriverLat, currentDriverLng);
        const estimatedMinutes = Math.round((dist / 30) * 60);
        
        document.getElementById('trackingPanel').style.display = 'block';
        document.getElementById('etaBadge').innerText = `المسافة: ${dist.toFixed(2)} كم | الوقت التقديري للوصول: ${estimatedMinutes <= 1 ? 'أقل من دقيقة' : estimatedMinutes + ' دقيقة'}`;
    }

    if (roomId) {
        db.ref(`rooms/${roomId}/driver_location`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lng) {
                currentDriverLat = data.lat;
                currentDriverLng = data.lng;

                const driverPos = [data.lat, data.lng];
                if (driverLiveMarker) {
                    moveDriverMarkerSmoothly(data.lat, data.lng);
                } else {
                    driverLiveMarker = L.marker(driverPos, {
                        icon: L.icon({
                            iconUrl: 'https://cdn-icons-png.flaticon.com/512/854/854878.png',
                            iconSize: [36, 36],
                            className: 'car-passenger-icon'
                        })
                    }).addTo(map).bindPopup("موقع السيارة الحالي 🚖");
                }
                calculateAndShowETA();
            }
        });
    }

    function handleSearchInput() {
        clearTimeout(searchTimeout);
        const query = document.getElementById('searchInput').value.trim();
        const list = document.getElementById('suggestionsList');
        if (query.length < 3) {
            list.style.display = 'none';
            return;
        }
        searchTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=eg&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                list.innerHTML = '';
                if (data && data.length > 0) {
                    list.style.display = 'block';
                    data.slice(0, 5).forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerText = item.display_name;
                        div.onclick = () => {
                            updateMarker(parseFloat(item.lat), parseFloat(item.lon));
                            document.getElementById('searchInput').value = item.display_name.split(',')[0];
                            list.style.display = 'none';
                        };
                        list.appendChild(div);
                    });
                } else {
                    list.style.display = 'none';
                }
            } catch (e) {
                list.style.display = 'none';
            }
        }, 300);
    }

    function sendHouseLocation() {
        if (!roomId) {
            alert('لا يمكن إرسال الموقع بدون رمز رحلة صحيح!');
            return;
        }
        const name = document.getElementById('passengerName').value.trim();
        if (!name) {
            alert('برجاء كتابة اسمك أولاً!');
            return;
        }
        db.ref(`rooms/${roomId}/rides`).push({
            name: name,
            lat: lat,
            lng: lng,
            timestamp: Date.now()
        }, (err) => {
            if (!err) {
                alert('تم إرسال عنوان بيتك للسائق بنجاح!');
                document.getElementById('trackingPanel').style.display = 'block';
                document.getElementById('trackingStatus').innerText = '✅ تم إرسال موقعك بنجاح! السائق يتابع رحلته الآن.';
            } else {
                alert('حدث خطأ في الاتصال.');
            }
        });
    }
    window.onload = getCurrentLocation;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة السائق - ترتيب الركاب</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; background: white; padding: 10px; border-radius: 12px; }
        .passenger-list { display: flex; flex-direction: column; gap: 12px; }
        .passenger-card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .distance-badge { background: #0284c7; color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .btn-nav { background: #22c55e; color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>امسح الـ QR Code لتحديد الموقع 📲</h2>
        <div id="qrcode"></div>
        <p style="font-size: 12px; color: #94a3b8;">شارك الكود مع الركاب للتسجيل في نفس الوقت</p>
    </div>

    <h3>قائمة الركاب (مرتبة من الأقرب للأبعد) 🚖</h3>
    <button class="clear-btn" onclick="clearRequests()">مسح جميع الطلبات</button>
    <br><br>
    
    <div id="passengersList" class="passenger-list">
        <p style="text-align: center; color: #64748b;">في انتظار تسجيل الركاب...</p>
    </div>
</div>

<script>
    // 1. إعدادات Firebase (متروكة لك لتسجيل مشروع مجاني على firebase.google.com أو تجربة النمط المباشر)
    const firebaseConfig = {
        databaseURL: "https://night-knights-app-default-rtdb.firebaseio.com" // ضع رابط قاعدة بياناتك هنا
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // موقع السائق الحالي (مكانه الافتراضي)
    const driverLat = 30.0444; 
    const driverLng = 31.2357;

    // 2. إنشاء الـ QR Code لصفحة الراكب المباشرة
    const passengerPageUrl = window.location.href.replace('index.html', '').replace(/\/$/, '') + '/passenger.html';
    new QRCode(document.getElementById("qrcode"), {
        text: passengerPageUrl,
        width: 160,
        height: 160
    });

    // 3. حساب المسافة الجغرافية بين السائق والراكب بالـ Kilometers
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // نصف قطر الأرض بالكيلومتر
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // 4. الاستماع لطلبات الركاب ومزامنتها وتنسيقها من الأقرب للأبعد
    db.ref('rides').on('value', (snapshot) => {
        const data = snapshot.val();
        const listElement = document.getElementById('passengersList');
        listElement.innerHTML = '';

        if (!data) {
            listElement.innerHTML = '<p style="text-align: center; color: #64748b;">لا توجد طلبات حتي الآن</p>';
            return;
        }

        let passengers = [];
        for (let id in data) {
            const p = data[id];
            const dist = calculateDistance(driverLat, driverLng, p.lat, p.lng);
            passengers.push({ ...p, id, distance: dist });
        }

        // ترتيب الصعود والتجميع من الأقرب إلى الأبعد
        passengers.sort((a, b) => a.distance - b.distance);

        passengers.forEach((p, index) => {
            const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
            listElement.innerHTML += `
                <div class="passenger-card">
                    <div>
                        <strong style="font-size: 16px;">#${index + 1} - ${p.name}</strong>
                        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">يبعد: ${p.distance.toFixed(2)} كم</div>
                    </div>
                    <div>
                        <span class="distance-badge">${p.distance.toFixed(1)} km</span>
                        <a href="${gmapsUrl}" target="_blank" class="btn-nav">خريطة 🗺️</a>
                    </div>
                </div>
            `;
        });
    });

    function clearRequests() {
        db.ref('rides').remove();
    }
</script>

</body>
</html>

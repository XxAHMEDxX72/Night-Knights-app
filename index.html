<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة السائق - انتظار الراكب</title>
    <!-- مكتبة Leaflet للخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; font-size: 20px; color: #38bdf8; }
        .qr-box { background: white; padding: 15px; border-radius: 12px; display: inline-block; margin: 15px 0; }
        #qrCanvas { display: block; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        #rideDetails { display: none; margin-top: 15px; }
        #map { height: 220px; border-radius: 10px; margin: 15px 0; border: 1px solid #475569; }
        .btn-nav { display: block; background: #22c55e; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; }
        .status-badge { background: #0284c7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <div id="qrSection">
        <h2>اطلب من الراكب مسح الـ QR Code 📲</h2>
        <span class="status-badge">في انتظار الراكب...</span>
        
        <div class="qr-box">
            <canvas id="qrCanvas"></canvas>
        </div>
        
        <p>خلي الراكب يفتح كاميرا الموبايل ويمسح الكود ده عشان يحدد اسمه ومكان بيته بنفسه.</p>
    </div>

    <!-- الجزء اللي هيظهر للسواق بعد ما الراكب يبعت الموقع -->
    <div id="rideDetails">
        <h2 style="color: #4ade80;">تم استلام موقع الراكب! 🚖</h2>
        <p><strong>اسم الراكب:</strong> <span id="passengerNameDisplay" style="color: white; font-weight: bold;">---</span></p>

        <div id="map"></div>

        <a id="gmapsLink" href="#" target="_blank" class="btn-nav">فتح خط السير في Google Maps 🗺️</a>
    </div>
</div>

<!-- مكتبة توليد الـ QR Code ومكتبة الخرائط -->
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/qrious.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // إنشاء رابط صفحة الراكب تلقائياً بناءً على مكان المجلد
    const currentPath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    const passengerPageUrl = `${currentPath}/passenger.html`;

    // توليد QR Code يحتوي على رابط صفحة الراكب
    new QRious({
        element: document.getElementById('qrCanvas'),
        value: passengerPageUrl,
        size: 200
    });

    // متابعة التحديثات (في حالة التجربة المحلية أو استقبال البيانات عبر URL)
    function checkForData() {
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const lat = parseFloat(urlParams.get('lat'));
        const lng = parseFloat(urlParams.get('lng'));

        if (name && lat && lng) {
            document.getElementById('qrSection').style.display = 'none';
            document.getElementById('rideDetails').style.display = 'block';
            document.getElementById('passengerNameDisplay').innerText = name;

            // عرض موقع الراكب على الخريطة للسواق
            const map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([lat, lng]).addTo(map).bindPopup(`موقع أخذ ${name}`).openPopup();

            // تجهيز زرار التوجيه لـ Google Maps
            document.getElementById('gmapsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
        }
    }

    window.onload = checkForData;
</script>

</body>
</html>

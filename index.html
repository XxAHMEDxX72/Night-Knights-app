<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - السائق</title>
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- SortableJS للترتيب بالسحب (6 نقاط) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .right-panel { width: 50%; padding: 15px; border-left: 2px solid #e2e8f0; overflow-y: auto; background: #fafafa; }
        .left-panel { width: 50%; height: 100%; }
        #map { width: 100%; height: 100%; }
        
        .passenger-card { display: flex; align-items: center; justify-content: space-between; background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #e5e7eb; }
        .drag-handle { cursor: grab; font-size: 20px; padding: 0 8px; color: #6b7280; user-select: none; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .info-text { font-size: 14px; font-weight: bold; }
        .sub-text { font-size: 12px; color: #4b5563; margin-top: 4px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h2>لوحة السائق</h2>
    <button id="btnQR" style="padding: 8px 16px; cursor:pointer;">عرض QR Code للركاب</button>
</header>

<div class="main-container" id="mainLayout">
    <!-- الشق الأيمن: الأسماء والعناوين -->
    <div class="right-panel">
        <h3>قائمة الركاب (<span id="pCount">0</span>)</h3>
        <div id="passengerList"></div>
    </div>

    <!-- الشق الأيسر: الخريطة -->
    <div class="left-panel">
        <div id="map"></div>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="modal-content">
        <h3>امسح الـ QR للوصول لفورم التسجيل</h3>
        <div id="qrcode" style="display: flex; justify-content: center; margin: 15px 0;"></div>
        <button id="btnCloseQR">إغلاق</button>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>

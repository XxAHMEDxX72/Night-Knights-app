<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة السائق - خط سير التوصيل</title>
    <!-- Firebase JS SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Leaflet CSS & Routing Machine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .room-bar { background: #1e293b; border: 1px solid #334155; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .room-bar input { background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #f8fafc; padding: 6px 10px; font-weight: bold; width: 140px; }
        
        .header-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; flex: 1; min-width: 140px; }
        .btn-gps { background: #10b981; }
        .btn-start { background: #2563eb; }
        .btn-toggle-qr { background: #0284c7; }
        .btn-clear { background: #ef4444; }
        
        .main-layout { display: flex; flex-direction: column; gap: 15px; flex: 1; }
        @media (min-width: 900px) {
            .main-layout.trip-active { flex-direction: row-reverse; }
            .trip-active .map-container { flex: 1.2; height: 75vh; }
            .trip-active .list-container { flex: 0.8; height: 75vh; overflow-y: auto; }
        }
        .qr-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; background: white; padding: 12px; border-radius: 12px; }
        #driverMap { height: 350px; width: 100%; border-radius: 16px; border: 1px solid #334155; }
        
        .passenger-list { display: flex; flex-direction: column; gap: 10px; }
        .passenger-card { background: #1e293b; border: 1px solid #334155; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .passenger-card.active-target { border: 2px solid #22c55e; background: #132e2b; }
        
        .controls { display: flex; gap: 4px; align-items: center; }
        .btn-sm { padding: 5px 8px; border-radius: 6px; border: none; background: #374151; color: white; cursor: pointer; font-size: 12px; }
        .btn-nav { background: #22c55e; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

<div class="room-bar">
    <div>
        <span>رمز الرحلة / الغرفة: </span>
        <input type="text" id="roomIdInput" readonly>
    </div>
    <button class="btn-sm" style="background:#475569;" onclick="changeRoomId()">🔄 تغيير رمز الغرفة</button>
</div>

<div class="header-actions">
    <button class="btn btn-gps" id="gpsBtn" onclick="toggleLiveTracking()">📍 تفعيل التتبع المباشر (GPS)</button>
    <button class="btn btn-start" id="startTripBtn" onclick="toggleTrip()">🚀 بدء الرحلة وعرض الخريطة</button>
    <button class="btn btn-toggle-qr" onclick="toggleQR()">📱 إظهار / إخفاء الـ QR</button>
    <button class="btn btn-clear" onclick="clearAllRides()">🗑️ مسح ركاب هذه الغرفة</button>
</div>

<div class="qr-card" id="qrContainer">
    <h2>امسح الـ QR للإنضمام لرحلة السائق 📲</h2>
    <div id="qrcode"></div>
    <p style="font-size: 12px; color: #94a3b8;">خّلّي الركاب يمسحوا الكود لتحديد منزلهم لهذه الرحلة تحديداً</p>
</div>

<div class="main-layout" id="mainLayout">
    <div class="map-container" id="mapWrapper" style="display: none;">
        <div id="driverMap"></div>
    </div>
    <div class="list-container">
        <h3 style="margin-top:0;">خط سير التوصيل 🚖</h3>
        <div id="passengersList" class="passenger-list">
            <p style="text-align: center; color: #64748b;">في انتظار تسجيل الركاب لعناوينهم...</p>
        </div>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
        authDomain: "black-knights-5c5a8.firebaseapp.com",
        databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
        projectId: "black-knights-5c5a8",
        storageBucket: "black-knights-5c5a8.firebasestorage.app",
        messagingSenderId: "699141823797",
        appId: "1:699141823797:web:11768011079d9701f0807c",
        measurementId: "G-JX743D3NH8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // إعداد معرّف الغرفة (Room ID)
    let currentRoomId = localStorage.getItem('driver_room_id');
    if (!currentRoomId) {
        currentRoomId = 'room_' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('driver_room_id', currentRoomId);
    }
    document.getElementById('roomIdInput').value = currentRoomId;

    let driverLat = 30.0444;
    let driverLng = 31.2357;
    let map, routingControl, driverMarker, qrCodeObj;
    let passengers = [];
    let isTripStarted = false;
    let watchPositionId = null;
    let ridesListener = null;

    // توليد QR موجه للغرفة الحالية
    function generateRoomQR() {
        const passengerPageUrl = window.location.href.replace('index.html', '').replace(/\/$/, '') + '/passenger.html?room=' + currentRoomId;
        const qrcodeContainer = document.getElementById("qrcode");
        qrcodeContainer.innerHTML = "";
        qrCodeObj = new QRCode(qrcodeContainer, { text: passengerPageUrl, width: 150, height: 150 });
    }

    function changeRoomId() {
        const newRoom = prompt("أدخل رمز الغرفة/الرحلة الجديد:", currentRoomId);
        if (newRoom && newRoom.trim() !== "") {
            currentRoomId = newRoom.trim().toLowerCase().replace(/\s+/g, '_');
            localStorage.setItem('driver_room_id', currentRoomId);
            document.getElementById('roomIdInput').value = currentRoomId;
            generateRoomQR();
            listenToRoomRides();
        }
    }

    function initMap() {
        if (map) return;
        map = L.map('driverMap').setView([driverLat, driverLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        driverMarker = L.marker([driverLat, driverLng]).addTo(map).bindPopup("موقع العربية الحالي").openPopup();
    }

    function toggleTrip() {
        isTripStarted = !isTripStarted;
        const layout = document.getElementById('mainLayout');
        const mapWrapper = document.getElementById('mapWrapper');
        const qrContainer = document.getElementById('qrContainer');
        const btn = document.getElementById('startTripBtn');
        if (isTripStarted) {
            qrContainer.style.display = 'none';
            mapWrapper.style.display = 'block';
            layout.classList.add('trip-active');
            btn.innerText = '🏁 إنهاء الرحلة';
            btn.style.background = '#d97706';
            initMap();
            setTimeout(() => { map.invalidateSize(); }, 300);
            startLiveTracking();
            updateRoute();
        } else {
            qrContainer.style.display = 'block';
            mapWrapper.style.display = 'none';
            layout.classList.remove('trip-active');
            btn.innerText = '🚀 بدء الرحلة وعرض الخريطة';
            btn.style.background = '#2563eb';
            stopLiveTracking();
        }
    }

    function toggleQR() {
        const qr = document.getElementById('qrContainer');
        qr.style.display = qr.style.display === 'none' ? 'block' : 'none';
    }

    function startLiveTracking() {
        if ("geolocation" in navigator) {
            if (watchPositionId !== null) return;
            watchPositionId = navigator.geolocation.watchPosition((pos) => {
                driverLat = pos.coords.latitude;
                driverLng = pos.coords.longitude;

                // تحديث موقع السائق الخاص بهذه الغرفة فقط
                db.ref(`rooms/${currentRoomId}/driver_location`).set({
                    lat: driverLat,
                    lng: driverLng,
                    timestamp: Date.now()
                });

                if (driverMarker) driverMarker.setLatLng([driverLat, driverLng]);
                if (map) map.panTo([driverLat, driverLng]);
                
                recalculateDistances();
                if (isTripStarted) updateRoute();
            }, (err) => {
                console.error("خطأ الـ GPS:", err.message);
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 1000 });
            
            const gpsBtn = document.getElementById('gpsBtn');
            if (gpsBtn) {
                gpsBtn.innerText = '🟢 التتبع المباشر يعمل';
                gpsBtn.style.background = '#059669';
            }
        }
    }

    function stopLiveTracking() {
        if (watchPositionId !== null) {
            navigator.geolocation.clearWatch(watchPositionId);
            watchPositionId = null;
            const gpsBtn = document.getElementById('gpsBtn');
            if (gpsBtn) {
                gpsBtn.innerText = '📍 تفعيل التتبع المباشر (GPS)';
                gpsBtn.style.background = '#10b981';
            }
        }
    }

    function toggleLiveTracking() {
        if (watchPositionId === null) startLiveTracking();
        else stopLiveTracking();
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function recalculateDistances() {
        passengers.forEach(p => {
            p.distance = calculateDistance(driverLat, driverLng, p.lat, p.lng);
        });
        renderPassengers();
    }

    // الاستماع لركاب الغرفة المحددة فقط
    function listenToRoomRides() {
        if (ridesListener) db.ref(`rooms/${currentRoomId}/rides`).off('value', ridesListener);
        
        ridesListener = db.ref(`rooms/${currentRoomId}/rides`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                passengers = [];
                renderPassengers();
                return;
            }
            let newPassengers = [];
            for (let id in data) {
                const p = data[id];
                const dist = calculateDistance(driverLat, driverLng, p.lat, p.lng);
                newPassengers.push({ ...p, id, distance: dist });
            }
            if (passengers.length === 0) {
                newPassengers.sort((a, b) => a.distance - b.distance);
                passengers = newPassengers;
            } else {
                const existingIds = passengers.map(p => p.id);
                newPassengers.forEach(np => {
                    if (!existingIds.includes(np.id)) passengers.push(np);
                });
            }
            renderPassengers();
            if (isTripStarted) updateRoute();
        });
    }

    function renderPassengers() {
        const listElement = document.getElementById('passengersList');
        listElement.innerHTML = '';
        if (passengers.length === 0) {
            listElement.innerHTML = '<p style="text-align: center; color: #64748b;">لا توجد عناوين مسجلة لهذه الرحلة</p>';
            return;
        }
        passengers.forEach((p, index) => {
            const isFirst = index === 0 && isTripStarted;
            const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
            listElement.innerHTML += `
                <div class="passenger-card ${isFirst ? 'active-target' : ''}">
                    <div>
                        <strong>#${index + 1} - ${p.name} ${isFirst ? '🎯 (الهدف الحالي)' : ''}</strong>
                        <div style="font-size: 11px; color: #94a3b8; margin-top: 2px;">البيت يبعد: ${p.distance.toFixed(2)} كم</div>
                    </div>
                    <div class="controls">
                        <button class="btn-sm" onclick="movePassenger(${index}, -1)">⬆️</button>
                        <button class="btn-sm" onclick="movePassenger(${index}, 1)">⬇️</button>
                        <button class="btn-sm" style="background:#ef4444;" onclick="deletePassenger('${p.id}')">🗑️</button>
                        <a href="${gmapsUrl}" target="_blank" class="btn-nav">Google Maps</a>
                    </div>
                </div>
            `;
        });
    }

    function movePassenger(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= passengers.length) return;
        const temp = passengers[index];
        passengers[index] = passengers[newIndex];
        passengers[newIndex] = temp;
        renderPassengers();
        if (isTripStarted) updateRoute();
    }

    function deletePassenger(id) {
        db.ref(`rooms/${currentRoomId}/rides/${id}`).remove();
        passengers = passengers.filter(p => p.id !== id);
        renderPassengers();
        if (isTripStarted) updateRoute();
    }

    function updateRoute() {
        if (!map || passengers.length === 0) return;
        const target = passengers[0];
        if (routingControl) map.removeControl(routingControl);
        routingControl = L.Routing.control({
            waypoints: [
                L.latLng(driverLat, driverLng),
                L.latLng(target.lat, target.lng)
            ],
            lineOptions: { styles: [{ color: '#3b82f6', weight: 6 }] },
            createMarker: function(i, wp) {
                return L.marker(wp.latLng).bindPopup(i === 0 ? "موقع العربية الحقيقي" : `بيت الراكب: ${target.name}`);
            }
        }).addTo(map);
    }

    function clearAllRides() {
        if(confirm(`هل تريد مسح جميع ركاب الغرفة (${currentRoomId})؟`)) {
            db.ref(`rooms/${currentRoomId}/rides`).remove();
            passengers = [];
            if (routingControl) map.removeControl(routingControl);
            renderPassengers();
        }
    }

    window.onload = () => {
        generateRoomQR();
        listenToRoomRides();
        startLiveTracking();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة السائق - خط سير التوصيل</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase JS SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: #0b1329; color: #f8fafc; margin: 0; padding: 15px; font-size: 14px; }
        body.light-mode { background: #f1f5f9; color: #0f172a; }

        /* الشريط العلوي للغرفة ولوحة السيارة */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #162238; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        body.light-mode .top-bar { background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .room-info, .plate-info { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .room-code { background: #0f172a; padding: 6px 12px; border-radius: 6px; font-family: monospace; color: #38bdf8; font-size: 15px; }
        body.light-mode .room-code { background: #e2e8f0; color: #0284c7; }

        input[type="text"] { background: #0f172a; border: 1px solid #334155; color: white; padding: 6px 12px; border-radius: 6px; font-size: 14px; text-align: center; outline: none; }
        body.light-mode input[type="text"] { background: #f8fafc; border-color: #cbd5e1; color: #0f172a; }

        /* شريط التحكم والأزرار */
        .controls-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1; min-width: 130px; text-decoration: none; }
        
        .btn-tracking { background: #10b981; }
        .btn-end { background: #f59e0b; }
        .btn-sort { background: #8b5cf6; }
        .btn-qr { background: #0ea5e9; }
        .btn-theme { background: #64748b; }
        .btn-clear { background: #ef4444; }
        .btn-change-room { background: #3b82f6; }

        /* التخطيط الرئيسي (الخريطة والقائمة) */
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: calc(100vh - 150px); min-height: 450px; }
        @media (max-width: 850px) { .main-content { grid-template-columns: 1fr; height: auto; } }

        #map { width: 100%; height: 100%; min-height: 350px; border-radius: 12px; border: 1px solid #334155; z-index: 1; }
        
        .route-panel { background: #162238; border-radius: 12px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid #334155; }
        body.light-mode .route-panel { background: #ffffff; border-color: #cbd5e1; }

        .panel-title { font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin: 0; }
        
        .passenger-card { background: #0f172a; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #3b82f6; }
        body.light-mode .passenger-card { background: #f8fafc; border-right-color: #2563eb; }

        .empty-state { text-align: center; color: #64748b; margin: auto; padding: 20px; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="room-info">
            <span>رمز الرحلة / الغرفة:</span>
            <span class="room-code" id="roomIdDisplay">جاري التحميل...</span>
            <button class="btn btn-change-room" onclick="changeRoomCode()" style="padding: 4px 8px; font-size: 11px; min-width: auto;">تغيير رمز الغرفة</button>
        </div>
        <div class="plate-info">
            <label for="plateInput">لوحة السيارة:</label>
            <input type="text" id="plateInput" placeholder="مثال: أ ب ج 1234" onchange="savePlateNumber()">
        </div>
    </div>

    <!-- شريط التحكم والأزرار (تم حذف زر لوحة المشرفين من هنا) -->
    <div class="controls-bar">
        <button class="btn btn-tracking" id="btnTracking" onclick="toggleTracking()">🟢 التتبع المباشر يعمل</button>
        <button class="btn btn-end" onclick="finishTrip()">💥 إنهاء الرحلة</button>
        <button class="btn btn-sort" onclick="sortPassengers()">📊 ترتيب الركاب تلقائياً</button>
        <button class="btn btn-qr" onclick="toggleQR()">🔲 إظهار / إخفاء الـ QR</button>
        <button class="btn btn-theme" onclick="toggleTheme()">🌗 وضع ليلي/نهاري</button>
        <button class="btn btn-clear" onclick="clearRoomRides()">🗑️ مسح ركاب هذه الغرفة</button>
    </div>

    <!-- التخطيط الرئيسي -->
    <div class="main-content">
        <div id="map"></div>
        <div class="route-panel">
            <h3 class="panel-title">
                <span>🚏 خط سير التوصيل</span>
                <span id="passengersCount" style="font-size: 12px; color: #38bdf8;">0 ركاب</span>
            </h3>
            <div id="passengersList">
                <div class="empty-state">لا توجد عناوين مسجلة لهذه الرحلة</div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA87OpSlrcoOt_xo3wi492GME0HuJk8E_4",
            authDomain: "black-knights-5c5a8.firebaseapp.com",
            databaseURL: "https://black-knights-5c5a8-default-rtdb.firebaseio.com",
            projectId: "black-knights-5c5a8",
            storageBucket: "black-knights-5c5a8.firebasestorage.app",
            messagingSenderId: "699141823797",
            appId: "1:699141823797:web:11768011079d9701f0807c",
            measurementId: "G-JX743D3NH8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomId = localStorage.getItem('driver_room_id') || 'uj470rv_ul8hXbNU';
        let map, driverMarker;
        let isTracking = true;
        let watchId = null;

        document.getElementById('roomIdDisplay').innerText = currentRoomId;

        // تهيئة الخريطة
        function initMap() {
            map = L.map('map').setView([29.9869, 31.1444], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            driverMarker = L.marker([29.9869, 31.1444]).addTo(map)
                .bindPopup("موقع السيارة الحالي 🚑").openPopup();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function changeRoomCode() {
            const newCode = prompt("أدخل رمز الغرفة الجديد:", currentRoomId);
            if (newCode && newCode.trim() !== "") {
                currentRoomId = newCode.trim();
                localStorage.setItem('driver_room_id', currentRoomId);
                document.getElementById('roomIdDisplay').innerText = currentRoomId;
                listenToRoomData();
            }
        }

        function savePlateNumber() {
            const plate = document.getElementById('plateInput').value;
            db.ref(`rooms/${currentRoomId}/plateNumber`).set(plate);
        }

        function toggleTracking() {
            isTracking = !isTracking;
            const btn = document.getElementById('btnTracking');
            if (isTracking) {
                btn.innerText = "🟢 التتبع المباشر يعمل";
                btn.style.background = "#10b981";
                startLocationWatch();
            } else {
                btn.innerText = "🔴 التتبع متوقف";
                btn.style.background = "#ef4444";
                if (watchId) navigator.geolocation.clearWatch(watchId);
            }
        }

        function startLocationWatch() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    if (!isTracking) return;
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    driverMarker.setLatLng([lat, lng]);
                    map.panTo([lat, lng]);

                    db.ref(`rooms/${currentRoomId}/driver_location`).set({
                        lat: lat,
                        lng: lng,
                        timestamp: Date.now()
                    });
                }, err => console.error(err), { enableHighAccuracy: true });
            }
        }

        function listenToRoomData() {
            db.ref(`rooms/${currentRoomId}`).on('value', snap => {
                const data = snap.val();
                const listEl = document.getElementById('passengersList');
                listEl.innerHTML = '';

                if (!data || !data.rides) {
                    listEl.innerHTML = '<div class="empty-state">لا توجد عناوين مسجلة لهذه الرحلة</div>';
                    document.getElementById('passengersCount').innerText = '0 ركاب';
                    return;
                }

                if (data.plateNumber) {
                    document.getElementById('plateInput').value = data.plateNumber;
                }

                let count = 0;
                for (let rId in data.rides) {
                    count++;
                    const ride = data.rides[rId];
                    listEl.innerHTML += `
                        <div class="passenger-card">
                            <div>
                                <strong>👤 ${ride.name || 'راكب بدون اسم'}</strong>
                                <div style="font-size:12px; color:#94a3b8; margin-top:4px;">📍 ${ride.address || 'عنوان غير محدد'}</div>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('passengersCount').innerText = `${count} ركاب`;
            });
        }

        function finishTrip() {
            if (confirm("هل أنت تأكد من إنهاء الرحلة الحالية وإرسالها للسجل؟")) {
                db.ref(`rooms/${currentRoomId}`).once('value').then(snap => {
                    const data = snap.val() || {};
                    let names = [];
                    let count = 0;
                    if (data.rides) {
                        for (let k in data.rides) {
                            count++;
                            if (data.rides[k].name) names.push(data.rides[k].name);
                        }
                    }

                    const historyData = {
                        roomId: currentRoomId,
                        plateNumber: data.plateNumber || 'غير محدد',
                        startTime: 'رحلة مكتملة',
                        endTime: new Date().toLocaleString('ar-EG'),
                        passengersCount: count,
                        passengersNames: names,
                        timestamp: Date.now()
                    };

                    return db.ref('trip_history').push(historyData);
                }).then(() => {
                    return db.ref(`rooms/${currentRoomId}`).remove();
                }).then(() => {
                    alert("تم إنهاء الرحلة ونقلها إلى سجل المشرفين بنجاح!");
                });
            }
        }

        function clearRoomRides() {
            if (confirm("هل أنت تأكد من مسح جميع ركاب هذه الغرفة؟")) {
                db.ref(`rooms/${currentRoomId}/rides`).remove();
            }
        }

        function sortPassengers() {
            alert("تم إرسال طلب إعادة ترتيب الركاب بناءً على الأقرب لموقع السيارة الحالي.");
        }

        function toggleQR() {
            alert("تفعيل / إخفاء رمز الـ QR للرحلة");
        }

        window.onload = () => {
            initMap();
            startLocationWatch();
            listenToRoomData();
        };
    </script>
</body>
</html>

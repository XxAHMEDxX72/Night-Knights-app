<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة السائق - استلام الطلب</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #1e293b; color: white; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #0f172a; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        #map { height: 300px; border-radius: 8px; margin: 15px 0; }
        .info { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .btn-nav { display: block; background: #22c55e; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>طلب جديد متوفر! 📍</h2>
    
    <div class="info">
        <p><strong>الراكب:</strong> <span id="passengerName">---</span></p>
        <p style="font-size: 12px; color: #94a3b8;" id="coordsText">---</p>
    </div>

    <div id="map"></div>

    <a id="googleMapsBtn" href="#" target="_blank" class="btn-nav">فتح خط السير في Google Maps 🗺️</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // قراءة البيانات المبعوثة من رابط الصفحة
    const urlParams = new URLSearchParams(window.location.search);
    const passengerName = urlParams.get('name') || "راكب غير معروف";
    const lat = parseFloat(urlParams.get('lat')) || 30.0444;
    const lng = parseFloat(urlParams.get('lng')) || 31.2357;

    // عرض بيانات الراكب
    document.getElementById('passengerName').innerText = passengerName;
    document.getElementById('coordsText').innerText = `الإحداثيات: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

    // عرض موقع الراكب للسائق على الخريطة
    const map = L.map('map').setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // وضع دبوس موقع الراكب
    L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>موقع أخذ ${passengerName}</b>`)
        .openPopup();

    // تجهيز زرار التوجيه المباشر لخريطة جوجل للسائق
    const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    document.getElementById('googleMapsBtn').href = gmapsUrl;
</script>

</body>
</html>
